<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60">
  <!--
    FR-18: ジグザグ結合の接続線が塗り領域からはみ出さないことの確認用。
    いずれも「1つのfill」の中に、直線でつなぐと塗りの外側を通ってしまう箇所を持つ形状。
    既定のDPI=72では1ユーザー単位≒0.353mm(隙間5単位≒1.8mm)なので、
    ジグザグON・許容距離倍率を4以上に上げると距離判定だけでは接続が成立してしまう条件になる。
  -->

  <!-- 左: 同一fill内に離れた2つの島(隙間5単位) -->
  <path
    d="M0,0 L20,0 L20,50 L0,50 Z
       M25,0 L45,0 L45,50 L25,50 Z"
    fill="#000"
    fill-rule="evenodd" />

  <!-- 中央: 幅4単位の細いスリット穴(同じ行の左右セグメントが近接する) -->
  <path
    d="M55,0 L85,0 L85,50 L55,50 Z
       M68,8 L72,8 L72,42 L68,42 Z"
    fill="#000"
    fill-rule="evenodd" />

  <!-- 右: 凹形状(L字)。凹み部分を横切るショートカット接続が起きうる -->
  <path d="M95,0 L120,0 L120,15 L105,15 L105,50 L95,50 Z" fill="#000" />
</svg>
