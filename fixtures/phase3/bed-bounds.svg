<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 201 155">
  <!-- 実機確定済みの描画可能領域(X49,Y35)-(X250,Y190 / 201x155mm、実測X44-255/Y30-195から
       安全マージンとして上下左右5mmずつ内側に狭めた値)の四隅・全体に一致する矩形。
       viewBox=0,0,201,155を描画可能領域全体に対応させ、実機での位置合わせを確認する -->
  <rect x="0" y="0" width="201" height="155" fill="none" stroke="#000" />
  <line x1="0" y1="0" x2="10" y2="0" stroke="#f00" />
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f00" />
  <line x1="191" y1="0" x2="201" y2="0" stroke="#f00" />
  <line x1="201" y1="0" x2="201" y2="10" stroke="#f00" />
  <line x1="0" y1="145" x2="0" y2="155" stroke="#f00" />
  <line x1="0" y1="155" x2="10" y2="155" stroke="#f00" />
  <line x1="201" y1="145" x2="201" y2="155" stroke="#f00" />
  <line x1="191" y1="155" x2="201" y2="155" stroke="#f00" />
</svg>
