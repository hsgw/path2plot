<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- FR-33: 真円判定・G2/G3出力とフォールバックの確認用 -->

  <!-- 通常の真円(rx=ry) -->
  <circle cx="30" cy="30" r="20" fill="none" stroke="#000" />

  <!-- 回転transform付きの真円(transform適用後も真円のまま) -->
  <g transform="rotate(35 90 30)">
    <circle cx="90" cy="30" r="20" fill="none" stroke="#f00" />
  </g>

  <!-- 非一様スケールで楕円化した円(transform適用後は楕円としてフォールバック直線分割) -->
  <g transform="translate(150,30) scale(1.8,0.6)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00f" />
  </g>

  <!-- 素のellipse要素(rx≠ry。常に直線分割) -->
  <ellipse cx="30" cy="75" rx="25" ry="12" fill="none" stroke="#080" />
</svg>
