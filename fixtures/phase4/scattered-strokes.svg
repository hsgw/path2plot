<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170">
  <!-- 貪欲法による移動距離最適化の効果確認用: 分散した短いストローク(意図的にSVG出現順はバラバラ) -->
  <line x1="150" y1="10" x2="160" y2="20" stroke="#000" />
  <line x1="10" y1="150" x2="20" y2="160" stroke="#000" />
  <line x1="80" y1="80" x2="90" y2="90" stroke="#000" />
  <line x1="20" y1="10" x2="30" y2="20" stroke="#000" />
  <line x1="140" y1="140" x2="150" y2="150" stroke="#000" />
  <line x1="10" y1="80" x2="20" y2="90" stroke="#000" />
  <line x1="100" y1="20" x2="110" y2="30" stroke="#000" />
  <line x1="30" y1="120" x2="40" y2="130" stroke="#000" />
  <line x1="130" y1="60" x2="140" y2="70" stroke="#000" />
  <line x1="60" y1="140" x2="70" y2="150" stroke="#000" />
</svg>
